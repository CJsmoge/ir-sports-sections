<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кабинет тренера — СпортСекции</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="master-layout">
    <!-- Сайдбар -->
    <aside class="master-sidebar">
      <div class="logo text-white mb-4">⚽ СпортСекции</div>
      <nav class="master-nav">
        <a href="#" class="active">Мои занятия</a>
        <a href="#">Расписание</a>
        <a href="#">Посещаемость</a>
        <a href="#">Выход</a>
      </nav>
    </aside>

    <!-- Шапка -->
    <header class="master-header">
      <h2>Мои занятия на сегодня</h2>
      <div class="user-profile">
        <span>Сергей Петров</span>
        <div class="avatar">СП</div>
      </div>
    </header>

    <!-- Основной контент -->
    <main class="master-main">
      <div class="lessons-grid">
        
        <!-- Карточка занятия -->
        <article class="lesson-card">
          <div class="lesson-time">18:00 — 19:30</div>
          <h3>Футбол (взрослые)</h3>
          <p class="text-muted">Зал №1, ул. Ленина, 15</p>
          <div class="lesson-footer">
            <span class="badge badge-success">12 записано</span>
            <a href="#" class="btn btn-sm btn-outline">Открыть</a>
          </div>
        </article>

        <article class="lesson-card">
          <div class="lesson-time">19:45 — 21:15</div>
          <h3>Футбол (дети 10-14 лет)</h3>
          <p class="text-muted">Зал №2, ул. Ленина, 15</p>
          <div class="lesson-footer">
            <span class="badge badge-warning">5 записано</span>
            <a href="#" class="btn btn-sm btn-outline">Открыть</a>
          </div>
        </article>

      </div>
    </main>

    <!-- Подвал -->
    <footer class="master-footer">
      <p>© 2026 СпортСекции. Кабинет тренера.</p>
    </footer>
  </div>

</body>
</html>
