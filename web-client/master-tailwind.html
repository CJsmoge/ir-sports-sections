<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кабинет тренера — Tailwind</title>
  <!-- Подключение Tailwind через CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2563EB',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

  <div class="flex min-h-screen">
    
    <!-- Sidebar (скрыт на мобильном, показан на lg) -->
    <aside class="hidden lg:flex flex-col w-64 bg-slate-900 text-white p-4">
      <div class="text-xl font-bold mb-6">⚽ СпортСекции</div>
      <nav class="flex flex-col gap-2">
        <a href="#" class="px-4 py-2 rounded-lg bg-slate-800 font-medium">Мои занятия</a>
        <a href="#" class="px-4 py-2 rounded-lg text-slate-300 hover:bg-slate-800">Расписание</a>
        <a href="#" class="px-4 py-2 rounded-lg text-slate-300 hover:bg-slate-800">Посещаемость</a>
        <a href="#" class="px-4 py-2 rounded-lg text-slate-300 hover:bg-slate-800">Выход</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-4 lg:p-8">
      
      <!-- Header -->
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 border-b border-slate-200 pb-4">
        <h2 class="text-2xl font-bold text-slate-900">Мои занятия на сегодня</h2>
        <div class="flex items-center gap-3">
          <span class="text-sm font-semibold">Сергей Петров</span>
          <div class="w-10 h-10 bg-primary text-white rounded-full flex items-center justify-center font-bold">
            СП
          </div>
        </div>
      </div>

      <!-- Grid карточек -->
      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
        
        <!-- Карточка 1 -->
        <article class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 hover:shadow-md transition">
          <div class="text-primary font-bold mb-2">18:00 — 19:30</div>
          <h3 class="font-bold text-slate-900 mb-1">Футбол (взрослые)</h3>
          <p class="text-sm text-slate-500 mb-4">Зал №1, ул. Ленина, 15</p>
          <div class="flex justify-between items-center mt-auto">
            <span class="bg-green-100 text-green-700 text-xs font-bold px-2 py-1 rounded">12 записано</span>
            <button class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium hover:bg-slate-50 transition">Открыть</button>
          </div>
        </article>

        <!-- Карточка 2 -->
        <article class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 hover:shadow-md transition">
          <div class="text-primary font-bold mb-2">19:45 — 21:15</div>
          <h3 class="font-bold text-slate-900 mb-1">Футбол (дети 10-14 лет)</h3>
          <p class="text-sm text-slate-500 mb-4">Зал №2, ул. Ленина, 15</p>
          <div class="flex justify-between items-center mt-auto">
            <span class="bg-amber-100 text-amber-700 text-xs font-bold px-2 py-1 rounded">5 записано</span>
            <button class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium hover:bg-slate-50 transition">Открыть</button>
          </div>
        </article>

      </div>
    </main>
  </div>

</body>
</html>
