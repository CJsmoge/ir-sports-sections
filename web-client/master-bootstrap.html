<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кабинет тренера — Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container-fluid">
    <div class="row min-vh-100">
      
      <!-- Sidebar -->
      <aside class="col-lg-2 bg-dark text-white p-3 d-none d-lg-block">
        <h5 class="mb-4 text-white">⚽ СпортСекции</h5>
        <nav class="nav flex-column">
          <a class="nav-link text-white-50 active bg-secondary rounded mb-1" href="#">Мои занятия</a>
          <a class="nav-link text-white-50" href="#">Расписание</a>
          <a class="nav-link text-white-50" href="#">Посещаемость</a>
          <a class="nav-link text-white-50" href="#">Выход</a>
        </nav>
      </aside>

      <!-- Main content -->
      <main class="col-12 col-lg-10 p-4">
        
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
          <h2>Мои занятия на сегодня</h2>
          <div class="d-flex align-items-center gap-2">
            <span class="fw-semibold">Сергей Петров</span>
            <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">СП</div>
          </div>
        </div>

        <!-- Cards -->
        <div class="row g-4">
          
          <div class="col-12 col-md-6 col-xl-4">
            <div class="card border-0 shadow-sm h-100">
              <div class="card-body d-flex flex-column">
                <div class="text-primary fw-bold mb-2">18:00 — 19:30</div>
                <h5 class="card-title">Футбол (взрослые)</h5>
                <p class="text-muted mb-4">Зал №1, ул. Ленина, 15</p>
                <div class="mt-auto d-flex justify-content-between align-items-center">
                  <span class="badge bg-success">12 записано</span>
                  <a href="#" class="btn btn-sm btn-outline-secondary">Открыть</a>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 col-md-6 col-xl-4">
            <div class="card border-0 shadow-sm h-100">
              <div class="card-body d-flex flex-column">
                <div class="text-primary fw-bold mb-2">19:45 — 21:15</div>
                <h5 class="card-title">Футбол (дети 10-14 лет)</h5>
                <p class="text-muted mb-4">Зал №2, ул. Ленина, 15</p>
                <div class="mt-auto d-flex justify-content-between align-items-center">
                  <span class="badge bg-warning text-dark">5 записано</span>
                  <a href="#" class="btn btn-sm btn-outline-secondary">Открыть</a>
                </div>
              </div>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
